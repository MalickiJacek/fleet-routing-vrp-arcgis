[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetvrp"
version = "1.0.0"
description = "Helpers for daily fleet routing with ArcGIS Pro: order scheduling, accuracy and savings analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacek Malicki" }]
requires-python = ">=3.10"
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
